# ============================================================================
# Локальное окружение house_kgz: Django + Postgres 16 + Redis 7 + Celery + MinIO
# ============================================================================

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      INSTALL_DEV: "true"
  image: house-kgz-backend:local
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
    DATABASE_URL: postgres://${POSTGRES_USER:-house_kgz}:${POSTGRES_PASSWORD:-house_kgz}@db:5432/${POSTGRES_DB:-house_kgz}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    AWS_S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - .:/app
    - media_data:/app/media
    - private_media_data:/app/private-media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # -------------------------------------------------------------------------
  # Django
  # -------------------------------------------------------------------------
  web:
    <<: *app
    container_name: house_kgz_web
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DATABASE_URL: postgres://${POSTGRES_USER:-house_kgz}:${POSTGRES_PASSWORD:-house_kgz}@db:5432/${POSTGRES_DB:-house_kgz}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AWS_S3_ENDPOINT_URL: http://minio:9000
      RUN_MIGRATIONS: "true"
    ports:
      - "${WEB_PORT:-8000}:8000"

  # -------------------------------------------------------------------------
  # PostgreSQL 16
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: house_kgz_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-house_kgz}
      POSTGRES_USER: ${POSTGRES_USER:-house_kgz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-house_kgz}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-house_kgz} -d ${POSTGRES_DB:-house_kgz}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Redis 7 — кэш и брокер Celery
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: house_kgz_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Celery worker (очередь default)
  # -------------------------------------------------------------------------
  celery:
    <<: *app
    container_name: house_kgz_celery
    command: celery -A config worker --loglevel=info --queues=default --concurrency=2

  # -------------------------------------------------------------------------
  # Celery beat (расписание в БД, django-celery-beat)
  # -------------------------------------------------------------------------
  celery-beat:
    <<: *app
    container_name: house_kgz_celery_beat
    command: >
      celery -A config beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # -------------------------------------------------------------------------
  # MinIO — S3-совместимое хранилище для медиа
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: house_kgz_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Разовая инициализация: создаёт бакет и открывает его на чтение
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: house_kgz_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BUCKET: ${AWS_STORAGE_BUCKET_NAME:-house-kgz-media}
      PRIVATE_BUCKET: ${AWS_PRIVATE_STORAGE_BUCKET_NAME:-house-kgz-kyc}
    # Два разных бакета с разными политиками: медиа объявлений раздаются
    # публично, документы KYC — только по подписанной ссылке.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set download local/$${BUCKET} &&
      mc mb --ignore-existing local/$${PRIVATE_BUCKET} &&
      mc anonymous set none local/$${PRIVATE_BUCKET} &&
      echo 'MinIO: бакеты '$${BUCKET}' и '$${PRIVATE_BUCKET}' готовы'
      "
    restart: "no"

volumes:
  pg_data:
  private_media_data:
  redis_data:
  minio_data:
  media_data:
