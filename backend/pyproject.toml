[project]
name = "house-kgz-backend"
version = "1.0.0"
description = "Backend API для мобильного приложения-агрегатора недвижимости house_kgz"
requires-python = ">=3.12"

dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.2",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "django-storages>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "django-celery-beat>=2.6",
    "redis>=5.0",
    "pillow>=10.4",
    # phonenumberslite — тот же модуль `phonenumbers`, но без geodata/carrier/
    # tz-метаданных (~4 МБ вместо ~47). Код использует только parse,
    # is_valid_number и format_number — см. apps/users/phone.py.
    "phonenumberslite>=9.0",
    "requests>=2.32",
    "python-magic>=0.4.27",
    "structlog>=24.4",
    "django-prometheus>=2.3",
    "django-csp>=3.8",
    "django-otp>=1.5",
    "cryptography>=43",
    "defusedxml>=0.7",
    "qrcode>=8.0",
]

[project.optional-dependencies]
# Sentry и FCM импортируются лениво и только когда заданы SENTRY_DSN /
# кредлы FCM (apps/common/observability.py, apps/notifications/push.py).
# Без этих extras включённая интеграция падает с ImportError.
sentry = ["sentry-sdk>=2.0"]
push = ["firebase-admin>=6.5"]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "django-debug-toolbar>=4.4",
    "locust>=2.31",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "apps"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# S — bandit: проверки безопасности (небезопасные вызовы, хардкод секретов).
select = ["E", "F", "I", "N", "UP", "B", "DJ", "S"]
ignore = [
    "B008",  # вызовы в аргументах по умолчанию — обычная практика в DRF
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = [
    "F403",
    "F405",  # звёздочный импорт из base — осознанный
    "S105",  # «пароль» в именах вроде PAYMENT_WEBHOOK_SECRET — имя настройки
    "S108",  # /tmp в настройках тестового окружения
]
# В тестах assert — это и есть способ проверки, а не небрежность.
"tests/*.py" = ["S101", "S105", "S106", "S311", "S603", "S607"]
# Демо- и нагрузочные данные: случайность здесь не криптографическая,
# и это осознанно — секретов из random здесь не делают.
"apps/common/management/commands/seed_demo.py" = ["S311"]
"apps/common/management/commands/generate_load_data.py" = ["S311"]
"loadtest/*.py" = ["S311"]
# Мок платёжного провайдера: имитация ответов банка, не боевая криптография.
"apps/billing/providers/mock.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
    "--reuse-db",
    "--strict-markers",
    "--cov=apps",
    "--cov=config",
    "--cov-report=term-missing",
    # Порог по проекту. Для apps/billing он выше и проверяется отдельно
    # (`make test-billing`): непокрытая ветка в леджере стоит дороже любой
    # другой, но требовать 95 % от seed-команд и админки бессмысленно.
    "--cov-fail-under=80",
]

filterwarnings = [
    # firebase-admin 7.x переименовал MulticastMessage.tokens в fids; мы шлём
    # именно регистрационные токены FCM, поэтому параметр не меняем.
    "ignore:MulticastMessage.tokens is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/asgi.py",
    "config/wsgi.py",
    # Настройки окружений исполняются самим Django до старта покрытия.
    "config/settings/local.py",
    "config/settings/production.py",
    # Нагрузочный сценарий и генератор данных — инструменты, а не код продукта.
    "loadtest/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

# ----------------------------------------------------------------------------
# Mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
