<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./screens/fig-tokens.css">
<link rel="stylesheet" href="./screens/fig-assets.css">
<link rel="stylesheet" href="./screens/verify/fig-assets.css">
<style>
body{margin:0;background:#1c1b19;-webkit-font-smoothing:antialiased}
a{color:#ea812e}a:hover{color:#f0a05f}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
.fig-group{height:812px}
</style>
</helmet>
<div style="display:flex;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:#fff">

  <div style="width:268px;flex:none;display:flex;flex-direction:column;background:#141312;border-right:1px solid rgba(255,255,255,.07)">
    <div style="padding:22px 20px 14px;display:flex;flex-direction:column;gap:4px">
      <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">House KGZ</div>
      <div style="font-size:11px;color:rgba(255,255,255,.4)">кликабельный прототип · 57 экранов</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:6px 12px 20px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ screens }}" as="s" hint-placeholder-count="12">
        <div onClick="{{ s.go }}" style="{{ s.rowStyle }}">
          <span style="font:600 10px/1 ui-monospace,Menlo,monospace;opacity:.5;min-width:18px">{{ s.num }}</span>
          <span style="font-size:12px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.name }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.07)">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font:600 11px/1 ui-monospace,Menlo,monospace;color:#ea812e">{{ current.num }}</span>
        <span style="font-size:14px;font-weight:600;letter-spacing:-.01em">{{ current.name }}</span>
        <span style="font:400 11px/1 ui-monospace,Menlo,monospace;color:rgba(255,255,255,.32)">{{ current.node }}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div onClick="{{ toggleZones }}" style="{{ zonesBtnStyle }}">Зоны</div>
        <div onClick="{{ back }}" style="height:30px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;align-items:center;cursor:pointer;font-size:12px" style-hover="background:rgba(255,255,255,.14)">Назад</div>
        <div onClick="{{ prev }}" style="width:34px;height:30px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px" style-hover="background:rgba(255,255,255,.14)">←</div>
        <div onClick="{{ next }}" style="width:34px;height:30px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px" style-hover="background:rgba(255,255,255,.14)">→</div>
        <div onClick="{{ restart }}" style="height:30px;padding:0 12px;border-radius:8px;background:rgba(234,129,46,.16);color:#ea812e;display:flex;align-items:center;cursor:pointer;font-size:12px;font-weight:600" style-hover="background:rgba(234,129,46,.26)">Сначала</div>
      </div>
    </div>

    <div style="flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px 56px">
      <div data-stage="true" style="width:{{ current.w }};height:{{ current.h }};flex:none;border-radius:10px;overflow-y:auto;overflow-x:hidden;background:{{ current.bg }};box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);position:relative">
        <div style="position:relative;width:{{ current.w }};overflow:hidden">
          <div style="{{ current.shift }}">
            <sc-if value="{{ current.main }}" hint-placeholder-val="{{ true }}">
              <x-import component-from-global-scope="{{ current.comp }}" from="./screens/Components.bundle.js" hint-size="375px,812px" class-name="{{ current.cls }}" style="{{ current.mountStyle }}"></x-import>
            </sc-if>
            <sc-if value="{{ current.verify }}" hint-placeholder-val="{{ false }}">
              <x-import component-from-global-scope="{{ current.comp }}" from="./screens/verify/Components.bundle.js" hint-size="375px,812px"></x-import>
            </sc-if>
          </div>
          <sc-for list="{{ hotspots }}" as="h" hint-placeholder-count="0">
            <div onClick="{{ h.go }}" title="{{ h.label }}" style="{{ h.style }}"></div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="height:38px;flex:none;display:flex;align-items:center;justify-content:center;gap:16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:rgba(255,255,255,.36)">
      <span>{{ hint }}</span>
      <span>← → — по списку экранов</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
const SCREENS = [

  ["Онбординг 1","StartScreen2","4:403"],
  ["Онбординг 2","StartScreen3","4:447"],
  ["Онбординг 3","StartScreen4","4:501"],
  ["Добро пожаловать","StartScreen5","57:282"],
  ["Код подтверждения","StartScreen6","63:606"],

  ["Код подтверждения · 2","StartScreen8","57:392"],

  ["Пополнение · 1","Frame48096303","155:1549",0,443,true],
  ["Пополнение · 2","Frame48096303","155:1549",1,443,true],
  ["Пополнение · 3","Frame48096303","155:1549",2,443,true],
  ["Пополнение · 4","Frame48096303","155:1549",3,443,true],
  ["Пополнение · 5","Frame48096303","155:1549",4,443,true],
  ["Объявление · 1","Frame48096302","155:380",0,434,false],
  ["Объявление · 2","Frame48096302","155:380",1,434,false],
  ["Объявление · 3","Frame48096302","155:380",2,434,false],
  ["Объявление · 4","Frame48096302","155:380",3,434,false],
  ["Объявление · 5","Frame48096302","155:380",4,434,false],
  ["Объявление · 6","Frame48096302","155:380",5,434,false],
  ["История трат · 1","Frame48096304","155:1750",0,442,true],
  ["История трат · 2","Frame48096304","155:1750",1,442,true],
  ["История трат · 3","Frame48096304","155:1750",2,442,true],
  ["История трат · 4","Frame48096304","155:1750",3,442,true],
  // регистрация исполнителя — отдельный бандл screens/verify
  ["Регистрация исполнителя","PhotoVerify1","63:812"],
  ["Код · исполнитель","PhotoVerify2","63:855"]
];
// флоу исполнителя: анкета → код → фото с лицом → фото с паспортом → профиль
const PRO_FLOW = [55, 56, 23, 24];
const TOPUP = 40;   // первый экран пополнения
const NEW_AD = 45;  // первый экран создания объявления
const HISTORY = 51; // первый экран истории пополнения и трат
const HISTORY_TABS = ['Все операции', 'Пополнение', 'Списание', 'Бонусы'];
// флоу объявления: 155:2313 → 1429 → 1329 → 1379 → 823 → 901 → 980
const AD_FLOW = [39, 36, 34, 35, 30, 31, 32];
const PHOTO_GRID = 19; // 57:1722 — «Фотообзор»
const PHOTO_VIEW = 20; // Frame 11133 — фото объекта на весь экран
const CARD_RE = /Технопарк|Асанбай|102 000|92 850/;
// экраны, где меню нужно, но в макете его нет
const NAV_SCREENS = [8, 9];

// x, y, w, h — координаты из Figma; to — индекс экрана
const HOTSPOTS = {
  1: [[31,670,314,52,2,"Далее"]],
  2: [[31,670,314,52,3,"Далее"]],
  3: [[31,670,314,52,4,"Далее"]],
  4: [[25,656,324,36,5,"Войти"]],
  5: [[0,431,375,381,8,"Ввести код"]],
  6: [[25,656,324,36,7,"Войти"]],
  7: [[0,431,375,381,8,"Ввести код"]],
  18: [[0,0,375,387,19,"Фотообзор"]],
  10: [[326,50,30,30,11,"Фильтры"]],
  17: [[326,50,30,30,11,"Фильтры"]],
  8: [
    [320,44,30,30,16,"Уведомления"],
    [25,138,358,82,9,"Подборка"],
    [25,236,325,50,10,"Поиск → каталог"],
    [25,302,325,82,10,"Категории → каталог"],
    [23,456,222,26,10,"Новые позиции: фильтр → каталог"],
    [25,512,325,422,9,"Объект → предложение"],
    [133,957,110,22,10,"Посмотреть все"]
  ]
};

// таб-бар: Главное · Поиск · История · История · Профиль
const TAB_TARGETS = [8, 10, 16, 15, 37];
// 4-я вкладка в макете дублирует «Историю» — заменяем на «Избранное» с сердцем
const HEART_TAB = 3;
const HEART_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="position:absolute;left:0;top:0;width:24px;height:24px">'
  + '<path d="M12 20.25c-.28 0-.55-.1-.76-.28C6.79 16.2 3.75 13.53 3.75 10.1c0-2.6 2-4.6 4.53-4.6 1.44 0 2.77.67 3.72 1.79.95-1.12 2.28-1.79 3.72-1.79 2.53 0 4.53 2 4.53 4.6 0 3.43-3.04 6.1-7.49 9.87-.21.18-.48.28-.76.28Z"'
  + ' fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
const ACCENT = '#EA812E';
const IDLE = 'rgb(172,172,176)';
// какой таб подсвечивать на каком экране
const SCREEN_TAB = { 8: 0, 9: 0, 21: 1, 10: 1, 11: 1, 17: 1, 16: 2, 15: 3, 12: 1, 14: 4, 22: 4, 37: 4 };
const NOTIFY = 16;         // 62:783 — «Уведомления»
const LIKED = 15;          // 63:227 — «Вам понравилось»
const CLIENT_PROFILE = 14; // 60:118 — «Ваш профиль», режим клиента
const PRO_PROFILE = 37;    // 155:1944 — профиль в режиме исполнителя

class Component extends DCLogic {
  state = { i: 0, zones: false, history: [], pro: false };

  _isTabRow(el) {
    return el && el.children && el.children.length === 5
      && el.textContent.replace(/\s+/g, '').indexOf('ГлавноеПоиск') === 0;
  }

  // делегирование: работает независимо от того, когда экран домонтировался
  _onStageClick(e) {
    const stage = document.querySelector('[data-stage]');
    if (!stage || !stage.contains(e.target)) return;
    let el = e.target, cell = null;
    while (el && el !== stage) {
      const t = (el.textContent || '').trim();
      if (this.state.i >= HISTORY && this.state.i <= HISTORY + 3) {
        const k = HISTORY_TABS.indexOf(t);
        if (k >= 0) { e.stopPropagation(); this.go(HISTORY + k, true); return; }
      }
      if (t === 'Пополнить' || t === 'Пополнить баланс') { e.stopPropagation(); this.go(TOPUP, true); return; }
      if (t.replace(/\s+/g, '').indexOf('Добавитьобъявление') === 0) { e.stopPropagation(); this.go(NEW_AD + 1, true); return; }
      if (t === 'История пополнения и трат') { e.stopPropagation(); this.go(HISTORY, true); return; }
      if (t === 'Уведомление' || t === 'Уведомления') { e.stopPropagation(); this.go(NOTIFY, true); return; }
      if (t === 'Вам понравилось') { e.stopPropagation(); this.go(LIKED, true); return; }
      // выбор роли при регистрации: исполнитель — свой профиль, клиент — обычный
      if (t === 'Режим исполнителя') {
        e.stopPropagation();
        this.setState({ pro: true });
        try { localStorage.setItem('housekgz.proto.pro', '1'); } catch (err) {}
        this.go(PRO_FLOW[0], true); return;
      }
      // шаги регистрации исполнителя: «Далее» и загрузка документов ведут вперёд
      if (PRO_FLOW.indexOf(this.state.i) >= 0 && (t === 'Далее' || t === 'Загрузить' || t === 'Загружено')) {
        e.stopPropagation(); this._proNext(); return;
      }
      if (t === 'Зарегистрироваться' || t === 'Зарегистрироватся') {
        e.stopPropagation();
        this.setState({ pro: false });
        try { localStorage.setItem('housekgz.proto.pro', '0'); } catch (err) {}
        this._nextStep(); return;
      }
      if (t.replace(/\s+/g, '').indexOf('Подробнее') === 0 && t.length < 20) { e.stopPropagation(); this.go(18, true); return; }
      if (t === 'Вернуться' && this.state.i === PHOTO_GRID) { e.stopPropagation(); this._back(); return; }
      if (t === 'Садыр Жапаров' || t === 'Садыр жапаров') { e.stopPropagation(); this.go(12, true); return; }
      if (t.replace(/\s+/g, '').indexOf('Изменитьобъявление') === 0 && this.state.i >= NEW_AD) { e.stopPropagation(); this.go(AD_FLOW[0], true); return; }
      if (t === 'Далее' || t === 'Продолжить') {
        e.stopPropagation();
        const k = AD_FLOW.indexOf(this.state.i);
        if (k >= 0 && k < AD_FLOW.length - 1) this.go(AD_FLOW[k + 1], true); else this._nextStep();
        return;
      }
      if (this.state.i === 38 && t.length < 90 && CARD_RE.test(t)) { e.stopPropagation(); this.go(NEW_AD, true); return; }
      if (this.state.i === 8 && t.length < 90 && CARD_RE.test(t)) { e.stopPropagation(); this.go(9, true); return; }
      if (this._isTabRow(el.parentElement)) { cell = el; break; }
      el = el.parentElement;
    }
    if (!cell) {
      // внутри регистрации исполнителя клик по экрану ведёт на следующий шаг
      if (PRO_FLOW.indexOf(this.state.i) >= 0) { e.stopPropagation(); this._proNext(); return; }
      // фотообзор — клик по фото открывает его во весь экран
      if (this.state.i === PHOTO_GRID) { e.stopPropagation(); this.go(PHOTO_VIEW, true); return; }
      // просмотр фото — клик ведёт дальше
      if (this.state.i === PHOTO_VIEW) { e.stopPropagation(); this.go(21, true); return; }
      // внутри флоу объявления клик по экрану ведёт на следующий шаг
      const k = AD_FLOW.indexOf(this.state.i);
      if (k >= 0 && k < AD_FLOW.length - 1) { e.stopPropagation(); this.go(AD_FLOW[k + 1], true); }
      return;
    }
    e.stopPropagation();
    const n = [...cell.parentElement.children].indexOf(cell);
    if (n === 4) { this.go(this.state.pro ? PRO_PROFILE : CLIENT_PROFILE, true); return; }
    if (TAB_TARGETS[n] != null) this.go(TAB_TARGETS[n], true);
  }

  // запоминаем нижнее меню и подставляем его на экраны, где его нет в макете
  _ensureNav() {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    // меню кэшируем на экранах, где оно есть в макете
    if (!this.__navCached) {
      const own = [...stage.querySelectorAll('div')].find(d => this._isTabRow(d));
      if (own && !stage.querySelector('[data-injected-nav]')) {
        const b = own.closest('div[style*="height: 84px"]') || own.parentElement;
        if (b) { try { sessionStorage.setItem('housekgz.nav', b.outerHTML); } catch (e) {} }
      }
    }
    const old = stage.querySelector('[data-injected-nav]');
    if (NAV_SCREENS.indexOf(this.state.i) < 0) { if (old) old.remove(); return; }
    // собственное меню экрана (не наш дубль) — запоминаем и ничего не добавляем
    const row = [...stage.querySelectorAll('div')]
      .find(d => this._isTabRow(d) && !(old && old.contains(d)));
    if (row) {
      const bar = row.closest('div[style*="height: 84px"]') || row.parentElement;
      if (bar) { try { sessionStorage.setItem('housekgz.nav', bar.outerHTML); } catch (e) {} }
      if (old) old.remove();
      return;
    }
    if (old) return;
    let html = '';
    try { html = sessionStorage.getItem('housekgz.nav') || ''; } catch (e) {}
    if (!html) return;
    const holder = document.createElement('div');
    holder.setAttribute('data-injected-nav', '');
    holder.style.cssText = 'position:sticky;bottom:0;left:0;width:375px;z-index:5';
    holder.innerHTML = html;
    const bar = holder.firstElementChild;
    if (bar) { bar.style.position = 'relative'; bar.style.top = '0'; bar.__injected = true; }
    stage.appendChild(holder);
  }

  _styleTabs() {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    const active = SCREEN_TAB[this.state.i];
    [...stage.querySelectorAll('div')].filter(d => this._isTabRow(d)).forEach(row => {
      this._heartTab(row);
      [...row.children].forEach((cell, n) => {
        cell.style.cursor = 'pointer';
        cell.style.borderRadius = '8px';
        cell.style.outline = this.state.zones ? '1.5px solid rgba(234,129,46,.9)' : '';
        if (active == null) return;
        const on = n === active;
        [...cell.querySelectorAll('svg')].forEach(svg => {
          if (svg.style.opacity === '0') return;
          if (!svg.__base) svg.__base = svg.style.color || '';
          svg.style.color = on ? ACCENT : (this._isHi(svg.__base) ? IDLE : svg.__base);
        });
        [...cell.querySelectorAll('span')].forEach(sp => {
          if (!sp.__base) sp.__base = sp.style.color || '';
          sp.style.color = on ? ACCENT : (this._isHi(sp.__base) ? IDLE : sp.__base);
          sp.style.fontWeight = on ? '600' : (sp.__baseW || sp.style.fontWeight);
        });
      });
    });
  }

  _proNext() {
    const k = PRO_FLOW.indexOf(this.state.i);
    this.go(k < PRO_FLOW.length - 1 ? PRO_FLOW[k + 1] : PRO_PROFILE, true);
  }

  // «Далее» ведёт на следующий кадр той же группы, иначе на следующий экран списка
  _nextStep() {
    const i = this.state.i, comp = SCREENS[i][1];
    for (let j = i + 1; j < SCREENS.length; j++) {
      if (SCREENS[j][1] === comp) { this.go(j, true); return; }
    }
    this.go(i + 1, true);
  }

  _heartTab(row) {
    const cell = row.children[HEART_TAB];
    if (!cell || cell.__heart) return;
    cell.__heart = true;
    const svg = [...cell.querySelectorAll('svg')].find(s => s.style.opacity !== '0');
    const holder = svg && svg.parentElement;
    if (holder) {
      holder.innerHTML = HEART_SVG;
      holder.style.overflow = 'visible';
      // цвет как у соседних иконок таб-бара, иначе сердце наследует белый
      const sib = [...row.querySelectorAll('svg')].find(s => s !== svg && !cell.contains(s) && s.style.opacity !== '0');
      const base = (sib && (sib.__base || sib.style.color)) || IDLE;
      const heart = holder.querySelector('svg');
      if (heart) { heart.__base = this._isHi(base) ? IDLE : base; heart.style.color = heart.__base; }
    }
    const sp = cell.querySelector('span');
    if (sp) sp.textContent = 'Избранное';
  }

  _isHi(c) { return /255,\s*39,\s*39|234,\s*129,\s*46/.test(c || ''); }

  _syncTabs() {
    [60, 300, 900, 2000].forEach(t => setTimeout(() => {
      this._ensureNav(); this._styleTabs(); this._enableCarousels(); this._fixSingleLine(); this._fixIconColors();
    }, t));
  }

  // иконка рядом с подписью иногда осталась белой из макета карточки — на светлом фоне её не видно
  _fixIconColors() {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    const dark = (c) => {
      const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)/.exec(c || '');
      if (!m) return null;
      const l = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) / 255;
      return l < 0.55 ? c : null;
    };
    [...stage.querySelectorAll('svg')].forEach(svg => {
      if (svg.__recolored) return;
      const r = svg.getBoundingClientRect();
      if (!r.width || r.width > 28 || r.height > 28) return;          // только иконки, не фото-слоты
      const st = svg.getAttribute('style') || '';
      if (/border-radius|align-self/.test(st)) return;                 // подпись фото-слота
      const c = getComputedStyle(svg).color;
      const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)/.exec(c || '');
      if (!m || (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) / 255 < 0.85) return;
      // подпись должна лежать в той же строке-флексе, рядом с иконкой
      const row = svg.closest('div[style*="row"]');
      if (!row) return;
      const label = [...row.children].filter(el => el.tagName === 'SPAN')
        .map(s => dark(getComputedStyle(s).color)).find(Boolean);
      if (!label) return;
      svg.__recolored = true;
      svg.style.color = label;
      if (svg.children.length > 1) return;                             // многоцветную графику не трогаем
      [...svg.querySelectorAll('[stroke]')].forEach(p => { if (p.getAttribute('stroke') !== 'currentColor') p.setAttribute('stroke', 'currentColor'); });
      [...svg.querySelectorAll('[fill]')].forEach(p => { const f = p.getAttribute('fill'); if (f && f !== 'none' && f !== 'currentColor') p.setAttribute('fill', 'currentColor'); });
    });
  }

  // в макете строка однострочная — не даём ей переноситься из-за подмены шрифта
  _fixSingleLine() {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    [...stage.querySelectorAll('span')].forEach(sp => {
      if (sp.__oneline) return;
      const h = parseFloat(sp.style.height || '0');
      const fs = parseFloat(getComputedStyle(sp).fontSize) || 0;
      if (!h || !fs) return;
      sp.__oneline = true;
      // в макете перенос задан вручную — оставляем ровно эти строки
      if ((sp.textContent || '').indexOf('\n') >= 0) { sp.style.whiteSpace = 'pre'; return; }
      const txt = (sp.textContent || '').trim();
      // короткая подпись без ручного переноса — всегда одна строка
      if (h > fs * 1.7 && !(txt.length <= 32 && h <= fs * 2.6)) return;
      sp.style.whiteSpace = 'nowrap';
    });
  }

  // горизонтальные ленты (тарифы, подборки, чипсы) — включаем прокрутку вбок
  _enableCarousels() {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    [...stage.querySelectorAll('div')].forEach(el => {
      if (el.__carousel) return;
      if (el.scrollWidth - el.clientWidth < 60) return;
      const cs0 = getComputedStyle(el);
      if (cs0.overflowX !== 'hidden') return;
      // лента идёт во всю ширину экрана; карточка со своей заливкой и радиусом — не лента
      if (el.clientWidth < 300) return;
      if (parseFloat(cs0.borderTopLeftRadius) >= 8 && cs0.backgroundColor !== 'rgba(0, 0, 0, 0)') return;
      el.__carousel = true;
      el.style.overflowX = 'auto';
      el.style.scrollbarWidth = 'none';
      el.style.webkitOverflowScrolling = 'touch';
    });
  }

  componentDidMount() {
    try {
      const saved = parseInt(localStorage.getItem('housekgz.proto.i') || '0', 10);
      if (!isNaN(saved) && saved >= 0 && saved < SCREENS.length) this.setState({ i: saved });
      if (localStorage.getItem('housekgz.proto.pro') === '1') this.setState({ pro: true });
    } catch (e) {}
    this._key = (e) => {
      if (e.key === 'ArrowRight') this.go(this.state.i + 1);
      else if (e.key === 'ArrowLeft') this.go(this.state.i - 1);
    };
    window.addEventListener('keydown', this._key);
    this._tick();
    this._syncTabs();
    this._click = (e) => this._onStageClick(e);
    document.addEventListener('click', this._click, true);
    const stage = document.querySelector('[data-stage]');
    if (stage && window.MutationObserver) {
      this._mo = new MutationObserver(() => { this._ensureNav(); this._styleTabs(); this._enableCarousels(); this._fixSingleLine(); });
      this._mo.observe(stage, { childList: true, subtree: true });
    }
  }

  componentDidUpdate(_p, prev) {
    const prevI = prev ? prev.i : this.__prevI;
    if (prevI !== this.state.i) this._tick();
    this.__prevI = this.state.i;
    this._syncTabs();
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this._key);
    document.removeEventListener('click', this._click, true);
    if (this._mo) this._mo.disconnect();
    clearTimeout(this._timer);
  }

  _tick() {
    clearTimeout(this._timer);
    if (this.state.i === 0) this._timer = setTimeout(() => this.go(1, true), 1600);
  }

  _back() {
    this.setState(s => {
      if (!s.history.length) return null;
      const h = [...s.history], i2 = h.pop();
      try { localStorage.setItem('housekgz.proto.i', String(i2)); } catch (e) {}
      return { i: i2, history: h };
    });
  }

  go(n, push) {
    const i = (n + SCREENS.length) % SCREENS.length;
    try { localStorage.setItem('housekgz.proto.i', String(i)); } catch (e) {}
    // возврат к сплэшу/онбордингу/авторизации = новый вход, режим снова клиентский
    if (i <= 7 && this.state.pro) {
      try { localStorage.setItem('housekgz.proto.pro', '0'); } catch (e) {}
      this.setState({ pro: false });
    }
    this.setState(s => ({ i, history: push ? [...s.history, s.i].slice(-30) : s.history }));
    const stage = document.querySelector('[data-stage]');
    if (stage) stage.scrollTop = 0;
  }

  renderVals() {
    const i = this.state.i, zones = this.state.zones;
    const pad = (n) => String(n + 1).padStart(2, '0');
    const screens = SCREENS.map((s, n) => ({
      num: pad(n),
      name: s[0],
      go: () => this.go(n),
      rowStyle: 'display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;'
        + (n === i ? 'background:rgba(234,129,46,.18);color:#f0a05f;' : 'color:rgba(255,255,255,.72);')
    }));
    const list = HOTSPOTS[i] || [];
    const hotspots = list.map(h => ({
      label: h[5],
      go: () => this.go(h[4], true),
      style: 'position:absolute;left:' + h[0] + 'px;top:' + h[1] + 'px;width:' + h[2] + 'px;height:' + h[3]
        + 'px;border-radius:10px;cursor:pointer;'
        + (zones ? 'background:rgba(234,129,46,.28);outline:1.5px solid rgba(234,129,46,.9);' : '')
    }));
    const c = SCREENS[i];
    const isGroup = c.length > 3;
    const crop = c[3] || 0;
    return {
      screens, hotspots,
      current: {
        num: pad(i), name: c[0], comp: c[1], node: c[2],
        bg: '#fff',
        verify: c[1].indexOf('PhotoVerify') === 0,
        main: c[1].indexOf('PhotoVerify') !== 0,
        // 57:1842 в макете 505×820 — показываем в натуральную величину, без масштабирования
        w: c[2] === '57:1842' ? '505px' : '375px',
        h: c[2] === '57:1842' ? '820px' : '812px',
        // группа 155:380 высотой 1160 из-за одного длинного кадра — остальные подрезаем по экрану
        shift: (crop ? 'margin-left:-' + (crop * (c[4] || 443)) + 'px' : '')
          + (c[1] === 'Frame48096302' && crop !== 1 ? ';height:812px;overflow:hidden' : ''),
        mountStyle: c[5] ? 'height:812px' : '',
        cls: c[5] ? 'fig-group' : ''
      },
      hint: PRO_FLOW.indexOf(i) >= 0
        ? 'регистрация исполнителя: клик по экрану — следующий шаг'
        : AD_FLOW.indexOf(i) >= 0 && AD_FLOW.indexOf(i) < AD_FLOW.length - 1
        ? 'флоу объявления: клик по экрану — следующий шаг'
        : (list.length
          ? 'на экране ' + list.length + ' активных зон — жмите кнопки как в приложении'
          : 'у этого экрана переходы не размечены — листайте стрелками или выберите слева'),
      zonesBtnStyle: 'height:30px;padding:0 12px;border-radius:8px;display:flex;align-items:center;cursor:pointer;font-size:12px;'
        + (zones ? 'background:rgba(234,129,46,.16);color:#ea812e;font-weight:600;' : 'background:rgba(255,255,255,.07);color:#fff;'),
      toggleZones: () => this.setState(s => ({ zones: !s.zones })),
      back: () => this._back(),
      next: () => this.go(i + 1),
      prev: () => this.go(i - 1),
      restart: () => {
        try { localStorage.setItem('housekgz.proto.pro', '0'); } catch (e) {}
        this.setState({ i: 0, history: [], pro: false });
      }
    };
  }
}

</script>
